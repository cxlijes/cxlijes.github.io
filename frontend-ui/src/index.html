<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATC</title>
    <script>
        // MAX открывает мини-апп по корневому URL, а страницы лежат в pages/.
        // Параметры (maxUserId и т.п.) обязательно переносим дальше.
        location.replace('pages/home.html' + location.search + location.hash);
    </script>
</head>
<body>
    <noscript>
        <a href="pages/home.html">Перейти в приложение</a>
    </noscript>
</body>
</html>
